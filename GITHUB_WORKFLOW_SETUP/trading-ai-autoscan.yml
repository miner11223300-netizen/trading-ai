name: Trading AI 24x7 Paper Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-ai-paper-worker
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout persistent paper state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled market scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_TIMEFRAME: "1h"
          MAX_OPEN_POSITIONS: "10"
          SCAN_INTERVAL_MIN: "15"
        run: python auto_worker.py

      - name: Persist paper trading database
        if: always()
        run: |
          if [ -f trading_ai_paper.db ]; then
            git config user.name "trading-ai-bot"
            git config user.email "trading-ai-bot@users.noreply.github.com"
            git add trading_ai_paper.db
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist paper trading state [skip ci]"
              git push origin HEAD:main
            fi
          fi
